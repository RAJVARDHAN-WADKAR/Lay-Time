version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laytime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laytime_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laytime_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laytime_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/laytime_db?schema=public
      JWT_SECRET: super_secret_jwt_key_for_laytime_dev_change_in_production
      JWT_EXPIRATION: 3600s
      JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_change_in_production
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      STORAGE_PATH: ./uploads
      OCR_PROVIDER: MOCK
      EMAIL_PROVIDER: MOCK
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data: